name: Maven Test Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jre-headless wget unzip
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip allure-2.27.0.zip -d /opt/allure
          sudo ln -s /opt/allure/allure-2.27.0/bin/allure /usr/bin/allure

      - name: Run Selenium Tests
        run: mvn clean test

      - name: Generate Allure Report
        run: allure generate target/allure-results -o target/allure-report --clean

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
