name: Maven Test Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install Allure CLI
        run: |
            sudo apt-get update
            sudo apt-get install -y wget unzip
            wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.zip
            unzip -o allure-2.30.0.zip -d /opt/allure
            sudo ln -s /opt/allure/allure-2.30.0/bin/allure /usr/bin/allure    

      - name: Run Selenium Tests
        run: mvn clean test

      - name: Generate Allure Report
        run: |
          mkdir -p target/allure-report
          allure generate target/allure-results --clean -o target/allure-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
