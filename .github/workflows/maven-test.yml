name: Maven Test Automation Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      # Step 3: Cache Maven Dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      # Step 4: Install Dependencies and Build Project
      - name: Build Project
        run: mvn clean install --batch-mode

      # Step 5: Run Tests with Allure
      - name: Run Tests
        env:
          JAVA_TOOL_OPTIONS: -Dallure.results.directory=allure-results
        run: mvn test

      # Step 6: Verify Allure Results Folder
      - name: Check Allure Results Directory
        run: ls -la allure-results

      # Step 7: Upload Allure Results
      - name: Archive Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/