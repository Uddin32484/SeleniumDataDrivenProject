name: Selenium DataDriven Test Automation Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # Step 3: Cache Maven Dependencies
      - name: Cache Maven dependencies

        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      # Step 4: Run Tests
      - name: Run Selenium Tests
        run: mvn -B clean test
        continue-on-error: true
        # install allure cli


      - name: Generate Allure Report
        run: allure generate target/allure-results -o target/allure-report --clean

      - name: Check Allure Results
        run: ls -la target/allure-results




  

      # Step 6: Upload Allure Report as artifact
      - name: Upload Allure Result
        uses: actions/upload-artifact@v4
        with:
          name: allure-result
          path: target/allure-result
