name: Run Tests and Publish Allure Report

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Run Maven tests
        run: mvn clean test

      - name: Install Allure CLI
        run: |
          sudo apt update
          sudo apt install -y default-jre unzip wget
          wget https://github.com/allure-framework/allure2/releases/download/2.36.0/allure-2.36.0.zip
          unzip allure-2.36.0.zip
          sudo mv allure-2.36.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate target/allure-results --clean -o target/allure-report
          echo "Allure report generated at target/allure-report"

      - name: Upload Allure Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Print Report URL
        run: |
          echo "========================================"
          echo " Allure Report will be available at:"
          echo " https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "========================================"

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
