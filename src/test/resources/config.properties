# Selenium Configuration Properties

# Browser Settings
browser=chrome
headless=true
implicit.wait=10

# Test Data
testdata.path=src/test/resources/testdata/

# Timeouts (in seconds)
page.load.timeout=30
script.timeout=20

# Screenshots
screenshots.on.failure=true
screenshots.path=target/screenshots/

# Reporting
report.path=target/test-reports/
